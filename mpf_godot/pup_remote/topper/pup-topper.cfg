; The remote topper's settings (mpf_godot/pup_remote/topper/topper.py). The installer copies this file to
; /etc/pup-topper.cfg; edit it there, then `sudo systemctl restart pup-topper`.

[topper]

; the game computer: "auto" finds it on the local network (the game needs [remote] enabled=true in
; the game's pup.local.cfg); else its name or address, e.g. host=192.168.1.20
host=auto
port=5052
; the name the game logs for this display
name=topper
; the PuP screens it shows: the topper's underlay (13), then its pop-up layer (14) on top
screens=13,14
; the topper videos, copied by the game's topper media tool on the game computer
media=~/pup-topper/media
; fit = whole video with black bars, fill = cover the screen (crops), stretch = distort to the screen
fit=fill
; vertical place of a fitted video: 0 = top, 0.5 = centre, 1 = bottom
align=0.5
; the cabinet plays the sound; true plays the videos' own sound here (HDMI or the Pi's audio out)
audio=false
mpv=mpv
; mpv on the Pi: straight to the screen (no desktop), H.264 decoded by the Pi's hardware decoder
mpv_args=--vo=gpu --gpu-context=drm --hwdec=v4l2m2m-copy
; true: a window on a desktop (testing), of window_size, instead of the whole screen
window=false
window_size=960x281
; seconds without news from the game before it is taken as gone (it pings every 5 s)
timeout=15
