# Default sound: HDMI output 0 (the Pi 5 has no jack). Plain hw through plug, no dmix (as the Pi 4 image).
# Card ids of the Pi 5 (vc4-hdmi): vc4hdmi0 = HDMI-A-1 (next to USB-C), vc4hdmi1 = HDMI-A-2. Change "vc4hdmi0" for the other
# output; for a USB sound card use "hw:Device".
pcm.!default {
    type plug
    slave.pcm "hw:vc4hdmi0,0"
}
ctl.!default {
    type hw
    card vc4hdmi0
}
