# /etc/asound.conf: the game's sound on the 3.5 mm jack (Godot uses ALSA "default"; no PulseAudio/PipeWire).
# Plain hw through plug: dmix stalls on snd_bcm2835 (hw_ptr never moves), and only the game plays sound.
# For the screen's speakers instead: slave.pcm "hdmi:CARD=vc4hdmi1,DEV=0".
pcm.!default {
    type plug
    slave.pcm "hw:CARD=Headphones,DEV=0"
}
ctl.!default {
    type hw
    card Headphones
}
