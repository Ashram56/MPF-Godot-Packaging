; Godot settings of the AK2PLUS, copied to game/override.cfg at every game install (MPF_GAME_OVERRIDE).
; The USB sound card plays 8, 16 or 48 kHz only: mixing at 44.1 kHz went through ALSA's resampler. A 30 ms buffer (two
; 21 ms periods instead of two 46 ms) halves the sound's delay; no underrun in a 10 minute game (measured 2026-10-28).
; run/max_fps=60: the AK2PLUS holds 60 FPS and a 30 FPS cap on a 60 Hz screen made frames last two vblanks. Set here and not as a
; command-line argument: a game's launcher need not accept Godot options (Transformers' run.py rejects --max-fps).
[application]

run/max_fps=60

[audio]

driver/output_latency=30
driver/mix_rate=48000
