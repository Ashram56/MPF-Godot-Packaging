# Owner's policy: CI runs only on pushes to main (and by hand); test locally before pushing a branch.
name: test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests and installer dry runs
        run: python -m unittest discover -s tests -v
      - name: Windows installer, dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install_windows.ps1 -DryRun

  install:
    # the real install and the smoke test: examples/minimal, Godot under Xvfb, MPF connected to GMC
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux
        if: runner.os == 'Linux'
        run: bash install/install_linux.sh --yes
      - name: macOS
        if: runner.os == 'macOS'
        run: bash install/install_macos.sh --yes
      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install_windows.ps1 -Yes
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m unittest tests.test_smoke -v
      - name: Toolchain check (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m mpf_godot info && .venv/bin/mpf --version
      - name: Toolchain check (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m mpf_godot info; .venv\Scripts\mpf --version
